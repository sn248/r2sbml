<svg xmlns="http://www.w3.org/2000/svg" width="248" height="285" viewBox="76 17 248 285" role="img">
  <title>r2sbml</title>
  <desc>Hex sticker: one SBML file fanning out into three generated model files, above the r2sbml wordmark.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- hex body -->
  <polygon points="200,21.4 320,90.7 320,229.3 200,298.6 80,229.3 80,90.7"
           fill="#F7F5F2" stroke="#2C2C2A" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="200,31.8 311,95.9 311,224.1 200,288.2 89,224.1 89,95.9"
           fill="none" stroke="#C9C6BE" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- source file -->
  <rect x="110" y="130" width="62" height="40" rx="4" fill="#E3EFEA" stroke="#0F6E56" stroke-width="1.4"/>
  <text x="141" y="150" text-anchor="middle" dominant-baseline="central"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#0F6E56">sbml</text>

  <!-- fan-out -->
  <path d="M172 150 L192 150" fill="none" stroke="#7A786F" stroke-width="1.6"/>
  <path d="M192 150 L192 116 L246 116" fill="none" stroke="#7A786F" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M192 150 L246 150" fill="none" stroke="#7A786F" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M192 150 L192 184 L246 184" fill="none" stroke="#7A786F" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- generated files -->
  <rect x="256" y="106" width="26" height="20" rx="3" fill="#DCD8CF" stroke="#5F5E5A" stroke-width="1.3"/>
  <rect x="256" y="140" width="26" height="20" rx="3" fill="#DCD8CF" stroke="#5F5E5A" stroke-width="1.3"/>
  <rect x="256" y="174" width="26" height="20" rx="3" fill="#DCD8CF" stroke="#5F5E5A" stroke-width="1.3"/>

  <!-- wordmark -->
  <line x1="146" y1="222" x2="254" y2="222" stroke="#C9C6BE" stroke-width="1"/>
  <text x="200" y="252" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="30" font-weight="500"
        letter-spacing="0.5" fill="#2C2C2A">r2sbml</text>
</svg>
